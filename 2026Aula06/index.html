</head>
<body>

        <section class="card-login">

            <header>
                <h1>Sistema Web</h1>
                <p>Faça seu login</p>
            </header>

            <form id="formLogin">

                <label>Email</label>
                <input type="email" id="email" placeholder="Digite seu email">

                <label>Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>
