<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Elegante</title>

  <!-- IMPORTANDO O CSS -->
  <link rel="stylesheet" href="css/styles_form02.css">

</head>
<body>

  <div class="login-container">

    <h1>Login</h1>

    <form>

      <div class="input-group">
        <label>Email</label>

        <input 
          type="email"
          placeholder="Digite seu email"
        >
      </div>

      <div class="input-group">
        <label>Senha</label>

        <input 
          type="password"
          placeholder="Digite sua senha"
        >
      </div>

      <button type="submit">
        Entrar
      </button>

    </form>

    <div class="extra-text">
      Não possui conta?
      <a href="#">Cadastre-se</a>
    </div>

  </div>

</body>
</html>
