<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<script src="js/script.js"></script>
<body>

<header>
    <nav>
        <div class="logo">Sistema Acadêmico</div>

        <ul class="menu">
            <li><a href="#">Início</a></li>
            <li><a href="#">Cadastros</a></li>
            <li><a href="#">Relatórios</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>
</header>

<main class="container">

    <section class="card">

        <h2>Cadastro de Usuário</h2>

        <form>

            <div class="form-grid">

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" pattern="[0-9]{11}">
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" pattern="[0-9]{11}">
                </div>

                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento">
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade" min="18" max="100">
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option>Selecione</option>
                        <option>GO</option>
                        <option>SP</option>
                        <option>MG</option>
                        <option>RJ</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="site">Website</label>
                    <input type="url" id="site">
                </div>

                <div class="campo full">
                    <label for="foto">Foto</label>
                    <input type="file" id="foto" accept="image/*">
                </div>

                <div class="campo full">
                    <label for="obs">Observações</label>
                    <textarea id="obs" rows="5"></textarea>
                </div>

                <div class="campo full">
                    <label>
                        <input type="checkbox" required>
                        Aceito os termos de uso
                    </label>
                </div>

            </div>

            <div class="botoes">
                <button type="submit" class="salvar">Cadastrar</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>

        </form>

    </section>

</main>

<footer>
    <p>© 2026 Sistema Acadêmico - Todos os direitos reservados</p>
</footer>

</body>
</html>
