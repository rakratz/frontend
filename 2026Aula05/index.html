<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard JS</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <div class="card">

      <h1>Dashboard Interativo</h1>

      <label>Nome</label>
      <input type="text" id="nome">

      <label>Idade</label>
      <input type="number" id="idade">

      <label>Número</label>
      <input type="number" id="numero">

      <label>Mensagem</label>
      <textarea id="mensagem"></textarea>

      <label>Senha</label>
      <input type="password" id="senha">

      <button id="temaBtn">Modo Dark</button>

    </div>

    <div class="painel">

      <h2 id="saudacao">Olá!</h2>

      <p id="idadeResultado"></p>

      <p id="numeroResultado"></p>

      <p id="contador"></p>

      <p id="senhaResultado"></p>

      <h3 id="relogio"></h3>

    </div>

  </div>

  <script src="js/script.js"></script>

</body>
</html>
